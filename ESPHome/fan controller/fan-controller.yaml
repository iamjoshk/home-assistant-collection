captive_portal:
  
web_server:
  port: 80
  auth:
    type: digest
    password: fancontroller
    username: fancontroller
  version: 3
  
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  
cc1101:
  cs_pin: GPIO05
  frequency: 303.9MHz
  output_power: 11
  carrier_sense_above_threshold: false

remote_transmitter:
  pin: GPIO12  # Must match GDO0
  id: c1101
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx
  non_blocking: true
        
remote_receiver:
  pin:
    number: GPIO27
#  tolerance: 25%
#  filter: 300us
    mode: INPUT_PULLUP
  dump: rc_switch
  tolerance: 30% 
        
globals:
  - id: fan_light_global
    type: bool
    restore_value: true
    initial_value: "false"
  - id: fan_global
    type: bool
    initial_value: "false"
    restore_value: true
  - id: fan_direction_global
    type: "std::string"
    initial_value: "forward"
