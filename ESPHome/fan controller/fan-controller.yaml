button:
  - platform: shutdown
    name: ${name} Shutdown

  - platform: restart
    name: ${name} Restart

#  - platform: template
#    name: "⚡ Fire Selected Test Code"
#    id: fire_test_code
#    on_press:
#      - remote_transmitter.transmit_rc_switch_raw:
#          code: !lambda |-
#            return "011110" + id(custom_test_payload);
#          protocol:
#            pulse_length: 321
#            sync: [1, 31]
#            zero: [1, 2]
#            one: [2, 1]
#            inverted: true
#          repeat: 
#            times: 12
#            wait_time: 10ms
    
  - platform: template
    name: Fan Off
    id: fan_off
#    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111101'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'false'
            
  - platform: template
    name: Fan Low
    id: fan_low
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110110111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
            
  - platform: template
    name: Fan Medium
    id: fan_medium
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110101111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
      
  - platform: template
    name: Fan High
    id: fan_high
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110011111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms            
      - globals.set:
          id: fan_global
          value: 'true'
                  
  - platform: template
    name: Fan Light Toggle
    id: fan_light
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111110'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          if (id(fan_light_global)) {
            id(fan_light_global) = false;
          } else {
            id(fan_light_global) = true;
          }

  - platform: template
    name: Fan Light Off
    id: fan_light_off
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110000011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          id(fan_light_global) = false;
          
  - platform: template
    name: Fan Direction
    id: fan_direction
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }

  - platform: template
    name: Fan Light Resync
    id: fan_light_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_light_global)) {
            id(fan_light_global) = false;
          } else {
            id(fan_light_global) = true;
          }

  - platform: template
    name: Fan Resync
    id: fan_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_global)) {
            id(fan_global) = false;
          } else {
            id(fan_global) = true;
          }

  - platform: template
    name: Fan Direction Resync
    id: fan_direction_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }
              
text_sensor:
  - platform: wifi_info
    mac_address: 
      name: ${name} MAC Address

  - platform: debug
    device:
      name: ${name} Device Info
    reset_reason:
      name: ${name} Reset Reason


binary_sensor:
  - platform: template
    name: Fan Light Status
    lambda: |-
      if (id(fan_light_global)) {
        return true;
      } else {
        return false;
      }  

  - platform: template
    name: Fan Status
    lambda: |-
      if (id(fan_global)) {
        return true;
      } else {
        return false;
      }

  - platform: template
    name: Fan Direction Status
    id: fan_direction_forward
    lambda: 'return id(fan_direction_global) == "forward";'

fan:
  - platform: template
    name: "Living Room Fan"
    id: living_room_fan
    has_direction: true
    has_oscillating: false
    speed_count: 3
#    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:ceiling-fan"

    on_turn_on:
      then:
        - button.press: fan_low
        - delay: 200ms
        - lambda: |-
            id(fan_global) = true;
            id(living_room_fan).publish_state();

    on_turn_off:
      then:
        - button.press: fan_off
        - delay: 200ms
        - lambda: |-
            id(fan_global) = false;
            id(living_room_fan).publish_state();

    on_speed_set:
      then:
        - lambda: |-
            if (id(living_room_fan).speed == 0) {
              id(fan_off).press();
              id(fan_global) = false;
            } else if (id(living_room_fan).speed == 1) {
              id(fan_low).press();
              id(fan_global) = true;
            } else if (id(living_room_fan).speed == 2) {
              id(fan_medium).press();
              id(fan_global) = true;
            } else if (id(living_room_fan).speed == 3) {
              id(fan_high).press();
              id(fan_global) = true;
            }
            id(living_room_fan).publish_state();
    

light:
  platform: binary
  name: Living Room Fan Light
  output: fan_light_output
  restore_mode: RESTORE_DEFAULT_OFF
  
output:
  platform: template
  id: fan_light_output
  type: binary
  write_action:
    - lambda: |-
        id(fan_light).press();
        
