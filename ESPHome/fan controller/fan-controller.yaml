cc1101:
  cs_pin: GPIO05
#  frequency: 303.9MHz
  frequency: 433.92MHz
  output_power: 11
  carrier_sense_above_threshold: false

remote_transmitter:
  pin: GPIO12  # Must match GDO0
  id: c1101_tx
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.set_frequency: 303.9MHz
      - cc1101.begin_tx:   
  on_complete:
    then:
      - cc1101.set_frequency: 433.92MHz
      - cc1101.begin_rx:
  non_blocking: true

        
remote_receiver:
  id: c1101_rx
  pin:
    number: GPIO27
#  tolerance: 25%
#  filter: 300us
    mode: INPUT_PULLUP
#  dump: 
#    - raw
  idle: 15ms
  filter: 200us        # don't drop valid short pulses; relax for discovery
  tolerance: 35%      # allow some timing variation

  on_raw:
    then:
      - lambda: |-

          // Convert the pulse vector into simple heuristics to detect a DSC-like frame 
          size_t total = x.size(); 
          int short_count = 0; // ~250us pulses 
          int long_count = 0; // ~500us pulses 
          int preamble_count = 0; // longer gaps/preamble
          
          for (auto v : x) {
            int a = std::abs(v);
            if (a >= 150 && a <= 400) ++short_count;
            else if (a > 400 && a <= 800) ++long_count;
            else if (a >= 1800 && a <= 7000) ++preamble_count;
          }
      
          bool len_ok = (total >= 40 && total <= 300);
          bool pattern_ok = ((short_count + long_count) >= (int)(0.55 * (int)total));
          bool has_preamble = (preamble_count >= 1);
          if (!(len_ok && pattern_ok && has_preamble)) return;
      
          // Optional short log
          size_t show = std::min<size_t>(total, 60);
          std::string s; s.reserve(show * 6);
          for (size_t i = 0; i < show; ++i) {
            s += std::to_string(x[i]);
            if (i + 1 < show) s += ", ";
          }
          if (show < total) s += ", ...";
          ESP_LOGI("dsc.raw", "Matched DSC-like frame len=%d short=%d long=%d pre=%d: %s",
                   (int)total, short_count, long_count, preamble_count, s.c_str());
      
          // CONFIRMATION (sliding-window) + COOLDOWN
          const unsigned long CONFIRM_WINDOW_MS = 2000;
          const int REQUIRED_CONFIRM = 2;
          const unsigned long COOLDOWN_MS = 1000;
      
          static unsigned long last_action_time = 0;
          static unsigned long proposals[REQUIRED_CONFIRM] = {0};
          static int prop_idx = 0;
          static int prop_filled = 0;
      
          unsigned long now = millis();
          if ((now - last_action_time) < COOLDOWN_MS) return;
      
          proposals[prop_idx] = now;
          prop_idx = (prop_idx + 1) % REQUIRED_CONFIRM;
          if (prop_filled < REQUIRED_CONFIRM) ++prop_filled;
          if (prop_filled < REQUIRED_CONFIRM) return;
      
          unsigned long oldest = proposals[prop_idx];
          unsigned long newest_index = (prop_idx + REQUIRED_CONFIRM - 1) % REQUIRED_CONFIRM;
          unsigned long newest = proposals[newest_index];
      
          if ((newest - oldest) <= CONFIRM_WINDOW_MS) {
            // Check actual light state (use the global that your binary_sensor reads)
            bool is_on = id(fan_light_global);
      
            if (is_on) {
              // Light currently ON -> send OFF command
              id(fan_light_off).press();
              ESP_LOGI("dsc.action", "Confirmed event: Sent LIGHT OFF");
            } else {
              // Light currently OFF -> send ON command
              id(fan_light_on).press();
              ESP_LOGI("dsc.action", "Confirmed event: Sent LIGHT ON");
            }
      
            // Enter cooldown and reset proposal buffer
            last_action_time = now;
            for (int i = 0; i < REQUIRED_CONFIRM; ++i) proposals[i] = 0;
            prop_filled = 0;
            prop_idx = 0;
          }

