                  wait_time: 10ms
            - delay: 40ms             

### RESYNC BUTTONS
              
  - platform: template
    name: Fan Light Resync
    id: fan_light_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_light_global)) {
            id(fan_light_global) = false;
          } else {
            id(fan_light_global) = true;
          }

  - platform: template
    name: Fan Resync
    id: fan_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_global)) {
            id(fan_global) = false;
          } else {
            id(fan_global) = true;
          }

  - platform: template
    name: Fan Direction Resync
    id: fan_direction_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }
              
text_sensor:
  - platform: wifi_info
    mac_address: 
      name: ${name} MAC Address

  - platform: debug
    device:
      name: ${name} Device Info
    reset_reason:
      name: ${name} Reset Reason


binary_sensor:

  - platform: template
    name: Fan Status
    lambda: |-
      if (id(fan_global)) {
        return true;
      } else {
        return false;
      }
    publish_initial_state: "true"

  - platform: template
    name: Fan Direction Status
    id: fan_direction_forward
    lambda: 'return id(fan_direction_global) == "forward";'

  - platform: template 
    name: Fan Light Status 
    id: fan_light_toggle 
    lambda: |- 
      return id(fan_light_global);    
    
### FAN CONTROL
    
fan:
  - platform: template
    name: "Living Room Fan"
    id: living_room_fan
    has_direction: true
    has_oscillating: false
    speed_count: 3
    restore_mode: NO_RESTORE
    icon: "mdi:ceiling-fan"
    on_turn_on:
      then:
        - fan.turn_on:
            id: living_room_fan
            speed: 1
        - button.press: fan_low
    on_turn_off:
      then:
        - fan.turn_off: 
            id: living_room_fan
        - button.press: fan_off
    on_speed_set:
      then:
        - lambda: |-
            if (id(living_room_fan).speed == 1) {
              id(fan_low).press();
            } else if (id(living_room_fan).speed == 2) {
              id(fan_medium).press();
            } else if (id(living_room_fan).speed == 3) {
              id(fan_high).press();
            }
    on_direction_set:
      then:
        - button.press: fan_low
        - delay: 10ms
        - button.press: fan_direction


### LIGHT SWITCH
            
light:
  platform: binary
  name: Living Room Fan Light
  id: living_room_fan_light
  output: fan_light_output
#  restore_mode: RESTORE_DEFAULT_OFF
  
#output:
#  platform: template
#  id: fan_light_output
#  type: binary
#  write_action:
#    - if:
#        condition:
#          lambda: 'return state;'
#        then:
#          - lambda: id(fan_light_on).press();
#        else:
#          - lambda: id(fan_light_off).press(); 

output:
  platform: template
  id: fan_light_output
  type: binary
  write_action:
    - if:
        condition:
          lambda: 'return state;'
        then:
          - remote_transmitter.transmit_rc_switch_raw:
              code: '011110111110'   # ON code (same as your Fan Light On)
              protocol:
                pulse_length: 321
                sync: [1, 31]
                zero: [1, 2]
                one: [2, 1]
                inverted: true
              repeat:
                times: 12
                wait_time: 10ms
        else:
          - remote_transmitter.transmit_rc_switch_raw:
              code: '011110000011'   # OFF code (same as your Fan Light Off)
              protocol:
                pulse_length: 321
                sync: [1, 31]
                zero: [1, 2]
                one: [2, 1]
                inverted: true
              repeat:
                times: 12
                wait_time: 10ms

