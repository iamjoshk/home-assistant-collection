substitutions:
  name: fan-controller
  devices: !secret devices
  ap_pw: !secret ap_pw
  ap_ssid: !secret ap_ssid
  ota_pw: !secret ota_pw

esphome:
  name: ${name}
  friendly_name: ${ name | title | replace('-',' ')}
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

# Enable logging
logger:
  level: DEBUG

debug:
  update_interval: 5s

# Enable Home Assistant API
api:
  encryption:
    key: ${ devices[name].api.key }
# Allow Over-The-Air updates
ota:
- platform: esphome
  id: my_ota
  password: ${ota_pw}${name}

wifi:
  ssid: !secret iot_ssid
  password: !secret iot_password
  post_connect_roaming: false
  manual_ip:
    static_ip: ${ devices[name].wifi.ip }
    gateway: ${ devices[name].wifi.gateway }
    subnet: ${ devices[name].wifi.subnet }
  ap:
    password: ${ap_pw}_${name}


  
