    id: fan_light_dimmer
    icon: mdi:lightbulb
    on_press:
    - repeat:
          count: 3
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: "011110111110"
                protocol:
                  pulse_length: 321
                  sync: [1, 31]
                  zero: [1, 2]
                  one: [2, 1]
                  inverted: true
                repeat:
