button:
  - platform: shutdown
    name: ${name} Shutdown

  - platform: restart
    name: ${name} Restart
    
#### FAN CONTROLS

  - platform: template
    name: Fan Off
    id: fan_off
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111101'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'false'
            
  - platform: template
    name: Fan Low
    id: fan_low
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110110111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
            
  - platform: template
    name: Fan Medium
    id: fan_medium
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110101111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
      
  - platform: template
    name: Fan High
    id: fan_high
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110011111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms            
      - globals.set:
          id: fan_global
          value: 'true'

  - platform: template
    name: Fan Direction
    id: fan_direction
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }

### FAN LIGHT CONTROLS

  # Replace your existing Fan Light On button block with this
  - platform: template
    name: Fan Light On
    id: fan_light_on
    internal: true
    on_press:
      - output.turn_on: fan_light_output
      - lambda: |-
          id(fan_light_global) = true;
          id(fan_light_toggle).publish_state(true);
  
  # Replace your existing Fan Light Off button block with this
  - platform: template
    name: Fan Light Off
    id: fan_light_off
    internal: true
    on_press:
      - output.turn_off: fan_light_output
      - lambda: |-
          id(fan_light_global) = false;
          id(fan_light_toggle).publish_state(false);

