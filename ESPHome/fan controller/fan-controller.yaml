substitutions:
  name: fan-controller
  devices: !secret devices
  ap_pw: !secret ap_pw
  ap_ssid: !secret ap_ssid
  ota_pw: !secret ota_pw

esphome:
  name: ${name}
  friendly_name: ${ name | title | replace('-',' ')}
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

# Enable logging
logger:
  level: DEBUG

debug:
  update_interval: 5s

# Enable Home Assistant API
api:
  encryption:
    key: ${ devices[name].api.key }
# Allow Over-The-Air updates
ota:
- platform: esphome
  id: my_ota
  password: ${ota_pw}${name}

wifi:
  ssid: !secret iot_ssid
  password: !secret iot_password
  post_connect_roaming: false
  manual_ip:
    static_ip: ${ devices[name].wifi.ip }
    gateway: ${ devices[name].wifi.gateway }
    subnet: ${ devices[name].wifi.subnet }
  ap:
    password: ${ap_pw}_${name}

  
#ble_client:
#  - mac_address:  F7:80:F2:D9:AD:2F
#    auto_connect: true
#    id: control_unit

#esp32_ble:
#  max_connections: 4

#esp32_ble_tracker:
#  id: ${name}_tracker
#  scan_parameters:
#    interval: 320ms
#    window: 30ms
#    active: true

#bluetooth_proxy:
#  active: true
#  id: ble_proxy

captive_portal:
  
web_server:
  port: 80
  auth:
    type: digest
    password: fancontroller
    username: fancontroller
  version: 3
  
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  
cc1101:
  cs_pin: GPIO05
  frequency: 303.9MHz
  output_power: 11
  carrier_sense_above_threshold: false

remote_transmitter:
  pin: GPIO12  # Must match GDO0
  id: c1101
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx
  non_blocking: true
        
remote_receiver:
  pin:
    number: GPIO27
#  tolerance: 25%
#  filter: 300us
    mode: INPUT_PULLUP
  dump: rc_switch
  tolerance: 30% 
        
globals:
  - id: fan_light_global
    type: bool
    restore_value: true
    initial_value: "false"
  - id: fan_global
    type: bool
    initial_value: "false"
    restore_value: true
  - id: fan_direction_global
    type: "std::string"
    initial_value: '"forward"'
  
button:
  - platform: shutdown
    name: ${name} Shutdown

  - platform: restart
    name: ${name} Restart
    
#### FAN CONTROLS

  - platform: template
    name: Fan Off
    id: fan_off
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111101'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'false'
            
  - platform: template
    name: Fan Low
    id: fan_low
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110110111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
            
  - platform: template
    name: Fan Medium
    id: fan_medium
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110101111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
      
  - platform: template
    name: Fan High
    id: fan_high
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110011111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms            
      - globals.set:
          id: fan_global
          value: 'true'

  - platform: template
    name: Fan Direction
    id: fan_direction
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }

### FAN LIGHT CONTROLS
          
  - platform: template
    name: Fan Light On
    id: fan_light_on
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111110'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          id(fan_light_global) = true;

  - platform: template
    name: Fan Light Off
    id: fan_light_off
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110000011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          id(fan_light_global) = false;
          
  - platform: template
    name: Fan Light Dimmer
    id: fan_light_dimmer
    icon: "mdi:lightbulb"
    on_press:
    - repeat:
          count: 3
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: "011110111110"
                protocol:
                  pulse_length: 321
                  sync: [1, 31]
                  zero: [1, 2]
                  one: [2, 1]
                  inverted: true
                repeat:
                  times: 12
                  wait_time: 10ms
            - delay: 40ms             

### RESYNC BUTTONS
              
  - platform: template
    name: Fan Light Resync
    id: fan_light_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_light_global)) {
            id(fan_light_global) = false;
          } else {
            id(fan_light_global) = true;
          }

  - platform: template
    name: Fan Resync
    id: fan_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_global)) {
            id(fan_global) = false;
          } else {
            id(fan_global) = true;
          }

  - platform: template
    name: Fan Direction Resync
    id: fan_direction_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }
              
text_sensor:
  - platform: wifi_info
    mac_address: 
      name: ${name} MAC Address

  - platform: debug
    device:
      name: ${name} Device Info
    reset_reason:
      name: ${name} Reset Reason


binary_sensor:
  - platform: template
    name: Fan Light Status
    lambda: |-
      if (id(fan_light_global)) {
        return true;
      } else {
        return false;
      }  

  - platform: template
    name: Fan Status
    lambda: |-
      if (id(fan_global)) {
        return true;
      } else {
        return false;
      }
    publish_initial_state: "true"

  - platform: template
    name: Fan Direction Status
    id: fan_direction_forward
    lambda: 'return id(fan_direction_global) == "forward";'

### FAN CONTROL
    
fan:
  - platform: template
    name: "Living Room Fan"
    id: living_room_fan
    has_direction: true
    has_oscillating: false
    speed_count: 3
    restore_mode: NO_RESTORE
    icon: "mdi:ceiling-fan"
    on_turn_on:
      then:
        - fan.turn_on:
            id: living_room_fan
            speed: 1
        - button.press: fan_low
    on_turn_off:
      then:
        - fan.turn_off: 
            id: living_room_fan
        - button.press: fan_off
    on_speed_set:
      then:
        - lambda: |-
            if (id(living_room_fan).speed == 1) {
              id(fan_low).press();
            } else if (id(living_room_fan).speed == 2) {
              id(fan_medium).press();
            } else if (id(living_room_fan).speed == 3) {
              id(fan_high).press();
            }
    on_direction_set:
      then:
        - button.press: fan_low
        - delay: 10ms
        - button.press: fan_direction


### LIGHT SWITCH
            
light:
  platform: binary
  name: Living Room Fan Light
  output: fan_light_output
  restore_mode: RESTORE_DEFAULT_OFF
  
output:
  platform: template
  id: fan_light_output
  type: binary
  write_action:
    - if:
        condition:
          lambda: 'return state;'
        then:
          - lambda: id(fan_light_on).press();
        else:
          - lambda: id(fan_light_off).press();
