substitutions:
  name: fan-controller
  devices: !secret devices
  ap_pw: !secret ap_pw
  ap_ssid: !secret ap_ssid
  ota_pw: !secret ota_pw
  ws_css: !secret ws_css
  ws_js: !secret ws_js

esphome:
  name: ${name}
  friendly_name: ${ name | title | replace('-',' ')}
  name_add_mac_suffix: false
  on_boot:
    - priority: 200
      then:
        # only decode protocol for DSC contact sensors
        - lambda: |-
            // build a new custom protocol list for rtl_433
            rtl_433_Decoder* rd=id(my_rtl433_rx).get_rtl_433_Decoder();
            r_cfg_t* cfg=&rd->g_cfg;
            list_t* r_devs=&cfg->demod->r_devs;
            ESP_LOGI("boot_rtl_433", "There are %d devices currently",r_devs->len);
            list_free_elems(r_devs,&free);
            char* arg = NULL;
  
            for (int i = 0; i < cfg->num_r_devices; i++) {
              if (cfg->devices[i].disabled <= 2) { // ignore anything hidden
                r_device* rdev=&cfg->devices[i];
                if ((strstr(rdev->name,"DSC"))) {
                  register_protocol(cfg, &cfg->devices[i], arg);
                  ESP_LOGI("boot_rtl_433", "Enabled protocol %s",rdev->name);
                }
              }
            }
  
            ESP_LOGI("boot_rtl_433", "... and now there are %d devices.",r_devs->len);
            
    - priority: -100.0
      then:
        - lambda: |-
            ESP_LOGI("boot_sync", "Restoring states from globals...");
    
            // 1. Restore fan state silently
            bool fan_st = id(fan_global);
            id(living_room_fan).state = fan_st;
            if (fan_st) {
              id(living_room_fan).speed = 1;
            }
            id(living_room_fan).publish_state();
    
            // 2. Restore light switch and binary light state silently
            bool light_st = id(fan_light_global);
            
            id(fan_light_switch).publish_state(light_st);
            id(living_room_fan_light).current_values.set_state(light_st);
            id(living_room_fan_light).remote_values.set_state(light_st);
            id(living_room_fan_light).publish_state();

            // 3. And the battery state
            id(dsc_battery).publish_state(id(battery_low_global));
            
            // 4. Clear boot flag
            id(is_booting) = false;
            ESP_LOGI("boot_sync", "Boot restoration complete. Actions enabled.");

