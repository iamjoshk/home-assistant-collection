    id: fan_status
    entity_category: ""
    lambda: |-
      return id(fan_global);
    web_server:
      sorting_group_id: status
      
  - platform: template 
    name: Fan Light Status 
    id: fan_light_toggle 
    entity_category: ""
    lambda: |- 
      return id(fan_light_global);
    web_server:
      sorting_group_id: status
      
  - platform: template
    name: Fan Direction Summer
    id: fan_direction_forward
    entity_category: ""
    lambda: |-
      return id(fan_direction_global);
    web_server:
      sorting_group_id: status

  - platform: template
    name: Light Switch Toggle
    id: dsc_toggle
    lambda: |-
      return id(dsc_toggle_global);
    web_server:
      sorting_group_id: status
      
  - platform: template
    name: Light Switch Battery
    id: dsc_battery
    device_class: battery
    lambda: |-
      return id(battery_low_global);
    web_server:
      sorting_group_id: status
      
### FAN CONTROL
fan:
  - platform: template
    name: "Living Room Fan"
    id: living_room_fan
    has_direction: true
    has_oscillating: false
    speed_count: 3
    restore_mode: ALWAYS_OFF
    icon: "mdi:ceiling-fan"
    on_turn_on:
      then:
        - if:
            condition:
              lambda: 'return !id(is_booting);'
            then:
              - button.press: fan_low
              - lambda: |-
                  id(living_room_fan).speed = 1;
              - globals.set:
                  id: fan_global
                  value: "true"
    on_turn_off:
      then:
        - if:
            condition:
              lambda: 'return !id(is_booting);'
            then:
              - button.press: fan_off
              - globals.set:
                  id: fan_global
                  value: "false"
    on_speed_set:
      then:
        - if:
            condition:
              lambda: 'return !id(is_booting);'
            then:
              - lambda: |-
                  if (id(living_room_fan).speed == 1) {
                    id(fan_low).press();
                  } else if (id(living_room_fan).speed == 2) {
                    id(fan_medium).press();
                  } else if (id(living_room_fan).speed == 3) {
                    id(fan_high).press();
                  }
    on_direction_set:
# fan needs to be on for the direction to be changed      
      then:
        - if:
            condition:
              lambda: 'return !id(is_booting);'
            then:
              - button.press: fan_low
              - delay: 10ms
              - button.press: fan_direction
    web_server: 
      sorting_group_id: controls
      sorting_weight: 20

### LIGHT CONTROL
# virtual light switch
light:
  - platform: binary
    name: Living Room Fan Light
    id: living_room_fan_light
    output: fan_light_output
    restore_mode: ALWAYS_OFF
    icon: "mdi:ceiling-fan-light"
    on_turn_on:
      then:
        - if:
            condition:
              lambda: 'return !id(is_booting);'
            then:
              - button.press: fan_light_on
    on_turn_off:
      then:
        - if:
            condition:
              lambda: 'return !id(is_booting);'
            then:
              - button.press: fan_light_off
    web_server: 
      sorting_group_id: controls
      sorting_weight: 10
      
output:
  platform: template
  id: fan_light_output
  type: binary
  write_action:
    - if:
        condition:
          lambda: 'return !id(is_booting);'
        then:
          - if:
              condition:
                lambda: 'return state;'
              then:
                - globals.set: 
                    id: fan_light_global
                    value: "true"
              else:
                - globals.set: 
                    id: fan_light_global
                    value: "false"

switch:
  platform: template
  id: fan_light_switch
  internal: true
  optimistic: true
  restore_mode: ALWAYS_OFF
  turn_on_action:
    - output.turn_on: fan_light_output
    - light.turn_on: living_room_fan_light
  turn_off_action:
    - output.turn_off: fan_light_output
    - light.turn_off: living_room_fan_light
