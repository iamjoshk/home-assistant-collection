spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

captive_portal:

rtl_433:
  id: my_rtl433_rx
  receiver_id: c1101_rx
  on_json_message: 
    then:  
      - lambda: |-         
          if (x["model"] == "DSC-Security" && x["id"].as<int>() == 2700721) {
            
            // 1. Cooldown logic for debounce repetitive messages
            static uint32_t last_action_time = 0;
            uint32_t now = millis();
            
            if (now - last_action_time > 1500) {
              last_action_time = now;
              
            // 2. Extract Battery Status
              if (x["battery_ok"].is<int>()) {
                int batt_ok = x["battery_ok"].as<int>();
                
                // Only update flash and publish state if the state actually changed
                if (id(battery_low_global) != (batt_ok == 0)) {
                  id(battery_low_global) = (batt_ok == 0);
                  id(dsc_battery).publish_state(batt_ok == 0);
                  ESP_LOGI("dsc.battery", "DSC Sensor Battery state updated: %s", (batt_ok == 0) ? "LOW" : "OK");
                }
              }
              
            // 3. Action based on contact sensor state change  
              bool is_on = id(fan_light_global);
              if (is_on) {
                id(fan_light_switch).turn_off();
                ESP_LOGI("dsc.action", "Confirmed event: Requested LIGHT OFF");
              } else {
                id(fan_light_switch).turn_on();
                ESP_LOGI("dsc.action", "Confirmed event: Requested LIGHT ON");
              }
              
            // 4. Tracking closed state for debugging    
              if (x["closed"].is<int>()) {
              int closed = x["closed"].as<int>();
              
              // Only update flash and publish state if the state actually changed
                if (id(dsc_toggle_global) != (closed == 0)) {
                  id(dsc_toggle_global) = (closed == 0);
                  id(dsc_toggle).publish_state(closed == 0);
                  ESP_LOGI("dsc.toggle", "DSC Sensor Closed state updated: %s", (closed == 0) ? "CLOSED" : "OPEN");
              }
            }
          }
          }
          
cc1101:
  cs_pin: GPIO25
#  frequency: 303.9MHz
  frequency: 433.92MHz
  output_power: 11
  carrier_sense_above_threshold: false

remote_transmitter:
# switch to 303.9MHz for tx fan controls, otherwise listen at 433.92MHz for the physical switch
  pin: GPIO22  # Must match GDO0
  id: c1101_tx
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.set_frequency: 303.9MHz
      - cc1101.begin_tx:   
  on_complete:
    then:
      - cc1101.set_frequency: 433.92MHz
      - cc1101.begin_rx:
  non_blocking: true

        
remote_receiver:
  id: c1101_rx
  pin:
    number: GPIO27
    mode: INPUT_PULLUP
#  dump: 
#    - raw
  idle: 15ms
  filter: 200us 
  tolerance: 35% 

radio_frequency:
  - platform: ir_rf_proxy
    name: RF Proxy Receiver
    frequency: 433.92MHz
    remote_receiver_id: c1101_rx
    internal: true
  
globals:
  - id: fan_light_global
    type: bool
    restore_value: true
    initial_value: "false"
    
  - id: fan_global
    type: bool
    restore_value: true
    initial_value: "false"
    
  - id: fan_direction_global
    type: bool
    restore_value: true
    initial_value: "true"

  - id: dsc_toggle_global
    type: bool
    restore_value: true
    initial_value: "false"
    
  - id: battery_low_global
    type: bool
    restore_value: true
    initial_value: "false"    
    
  - id: is_booting
    type: bool
    restore_value: no
    initial_value: "true"    
    
button:
  - platform: shutdown
    name: ${name} Shutdown
    web_server:
      sorting_group_id: system
      
  - platform: restart
    name: ${name} Restart
    web_server:
      sorting_group_id: system

#### FAN CONTROLS

  - platform: template
    name: Fan Off
    id: fan_off
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111101'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'false'
            
  - platform: template
    name: Fan Low
    id: fan_low
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110110111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
            
  - platform: template
    name: Fan Medium
    id: fan_medium
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110101111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
      
  - platform: template
    name: Fan High
    id: fan_high
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110011111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms            
      - globals.set:
          id: fan_global
          value: 'true'

  - platform: template
    name: Fan Direction
    id: fan_direction
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          if (id(fan_direction_global)) {
            id(fan_direction_global) = false;
          } else {
            id(fan_direction_global) = true;
          }
          
### FAN LIGHT CONTROLS
  - platform: template
    name: Fan Light On
    id: fan_light_on
    internal: true
    on_press:
      - if:
          condition:
            lambda: 'return !id(is_booting);'
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: '011110111110'
                protocol:
                  pulse_length: 321
                  sync: [1, 31]
                  zero: [1, 2]
                  one: [2, 1]
                  inverted: true
                repeat:
                  times: 12
                  wait_time: 10ms
            - globals.set:
                id: fan_light_global
                value: "true"
          
  - platform: template
    name: Fan Light Off
    id: fan_light_off
    internal: true
    on_press:
      - if:
          condition:
            lambda: 'return !id(is_booting);'
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: '011110111110'
                protocol:
                  pulse_length: 321
                  sync: [1, 31]
                  zero: [1, 2]
                  one: [2, 1]
                  inverted: true
                repeat:
                  times: 12
                  wait_time: 10ms
            - globals.set:
                id: fan_light_global
                value: 'false'

# this automates the dimming process, the light brightens until max and then reverses until dimmest, then starts brightening again
  - platform: template
    name: Fan Light Dimmer
    id: fan_light_dimmer
    icon: mdi:lightbulb
    on_press:
    - repeat:
          count: 3
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: "011110111110"
                protocol:
                  pulse_length: 321
                  sync: [1, 31]
                  zero: [1, 2]
                  one: [2, 1]
                  inverted: true
                repeat:
                  times: 12
                  wait_time: 10ms
            - delay: 40ms             
    web_server: 
      sorting_group_id: controls
      sorting_weight: 30
      
# this button turns both the fan and light off, which is helpful if states get out of sync in HA
  - platform: template
    name: Fan All Off
    id: fan_all_off
    icon: "mdi:power"
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
# code 011110000011 turns both light and fan off
          code: '011110000011'
          protocol:
            pulse_length: 321
            sync:
              - 1
              - 31
            zero:
              - 1
              - 2
            one:
              - 2
              - 1
            inverted: true
          repeat:
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_light_global
          value: 'false'
      - globals.set:
          id: fan_global
          value: "false"
      - fan.turn_off: living_room_fan    
    web_server:
      sorting_group_id: controls
      sorting_weight: 40
              
### RESYNC BUTTONS
# buttons if the states get out of sync              
  - platform: template
    name: Fan Light Resync
    id: fan_light_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      then:
        - lambda: |
            if (id(fan_light_global)) {
              id(fan_light_global) = false;
            } else {
              id(fan_light_global) = true;
            }
    web_server:
      sorting_group_id: status
      
  - platform: template
    name: Fan Resync
    id: fan_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_global)) {
            id(fan_global) = false;
          } else {
            id(fan_global) = true;
          }
    web_server:
      sorting_group_id: status
      
  - platform: template
    name: Fan Direction Resync
    id: fan_direction_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      then:
        - lambda: |
            if (id(fan_direction_global)) {
              id(fan_direction_global) = false;
            } else {
              id(fan_direction_global) = true;
            }
    web_server:
      sorting_group_id: status
      
