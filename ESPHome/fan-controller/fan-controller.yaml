spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  
cc1101:
  cs_pin: GPIO25
#  frequency: 303.9MHz
  frequency: 433.92MHz
  output_power: 11
  carrier_sense_above_threshold: false

remote_transmitter:
# switch to 303.9MHz for tx fan controls, otherwise listen at 433.92MHz for the physical switch
  pin: GPIO22  # Must match GDO0
  id: c1101_tx
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.set_frequency: 303.9MHz
      - cc1101.begin_tx:   
  on_complete:
    then:
      - cc1101.set_frequency: 433.92MHz
      - cc1101.begin_rx:
  non_blocking: true

        
remote_receiver:
  id: c1101_rx
  pin:
    number: GPIO27
    mode: INPUT_PULLUP
#  dump: 
#    - raw
  idle: 15ms
  filter: 200us 
  tolerance: 35% 

  on_raw:
    then:
      lambda: |-
        // Lightweight on_raw: no std::string / large allocations
        size_t total = x.size();
        int short_count = 0;
        int long_count = 0;
        int preamble_count = 0;
      
        for (auto v : x) {
          int a = std::abs(v);
          if (a >= 150 && a <= 400) ++short_count;
          else if (a > 400 && a <= 800) ++long_count;
          else if (a >= 1800 && a <= 7000) ++preamble_count;
        }
      
        // Heuristics: tune these if needed
        if (!(total >= 40 && total <= 300)) return;
        if (!((short_count + long_count) >= (int)(0.55 * (int)total))) return;
        if (preamble_count < 1) return;
      
        // Small, safe log (no string building)
        ESP_LOGI("dsc.raw", "Matched DSC-like frame len=%d short=%d long=%d pre=%d",
                 (int)total, short_count, long_count, preamble_count);
      
        // CONFIRMATION (sliding-window) + COOLDOWN (no heap)
        const unsigned long CONFIRM_WINDOW_MS = 2000;
        const int REQUIRED_CONFIRM = 3;
        const unsigned long COOLDOWN_MS = 1000;
      
        static unsigned long last_action_time = 0;
        static unsigned long proposals[REQUIRED_CONFIRM] = {0};
        static int prop_idx = 0;
        static int prop_filled = 0;
      
        unsigned long now = millis();
      
        // cooldown: ignore proposals if still cooling down
        if ((now - last_action_time) < COOLDOWN_MS) return;
      
        // record this proposal
        proposals[prop_idx] = now;
        prop_idx = (prop_idx + 1) % REQUIRED_CONFIRM;
        if (prop_filled < REQUIRED_CONFIRM) ++prop_filled;
        if (prop_filled < REQUIRED_CONFIRM) return;
      
        unsigned long oldest = proposals[prop_idx]; // next index to overwrite
        unsigned long newest_index = (prop_idx + REQUIRED_CONFIRM - 1) % REQUIRED_CONFIRM;
        unsigned long newest = proposals[newest_index];
      
        if ((newest - oldest) <= CONFIRM_WINDOW_MS) {
          // Use the canonical global to decide which RF command to send.
          // This uses the output API (safe) so write_action updates global + publishes.
          bool is_on = id(fan_light_global);
          if (is_on) {
            id(fan_light_switch).turn_off();
            ESP_LOGI("dsc.action", "Confirmed event: Requested LIGHT OFF");
          } else {
            id(fan_light_switch).turn_on();
            ESP_LOGI("dsc.action", "Confirmed event: Requested LIGHT ON");
          }
      
          // enter cooldown and reset buffer
          last_action_time = now;
          for (int i = 0; i < REQUIRED_CONFIRM; ++i) proposals[i] = 0;
          prop_filled = 0;
          prop_idx = 0;
        }

radio_frequency:
  - platform: ir_rf_proxy
    name: RF Proxy Receiver
    frequency: 433.92MHz
    remote_receiver_id: c1101_rx
  
globals:
  - id: fan_light_global
    type: bool
    restore_value: true
    initial_value: "false"
    update_interval: 5s
    
  - id: fan_global
    type: bool
    restore_value: true
    initial_value: "false"
    update_interval: 5s
    
  - id: fan_direction_global
    type: "std::string"
    restore_value: true
    initial_value: "\"forward\""
    update_interval: 5s
    
button:
  - platform: shutdown
    name: ${name} Shutdown

  - platform: restart
    name: ${name} Restart
    
#### FAN CONTROLS

  - platform: template
    name: Fan Off
    id: fan_off
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111101'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'false'
            
  - platform: template
    name: Fan Low
    id: fan_low
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110110111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
            
  - platform: template
    name: Fan Medium
    id: fan_medium
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110101111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_global
          value: 'true'
      
  - platform: template
    name: Fan High
    id: fan_high
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110011111'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms            
      - globals.set:
          id: fan_global
          value: 'true'

  - platform: template
    name: Fan Direction
    id: fan_direction
    internal: true
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111011'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat: 
            times: 12
            wait_time: 10ms
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }

