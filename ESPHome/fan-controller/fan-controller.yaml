# this automates the dimming process, the light brightens until max and then reverses until dimmest, then starts brightening again
  - platform: template
    name: Fan Light Dimmer
    id: fan_light_dimmer
    icon: mdi:lightbulb
    on_press:
    - repeat:
          count: 3
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: "011110111110"
                protocol:
                  pulse_length: 321
                  sync: [1, 31]
                  zero: [1, 2]
                  one: [2, 1]
                  inverted: true
                repeat:
                  times: 12
                  wait_time: 10ms
            - delay: 40ms             

### RESYNC BUTTONS
# config buttons if the states get out of sync              
  - platform: template
    name: Fan Light Resync
    id: fan_light_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      then:
        - lambda: |
            if (id(fan_light_global)) {
              id(fan_light_global) = false;
            } else {
              id(fan_light_global) = true;
            }

  - platform: template
    name: Fan Resync
    id: fan_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_global)) {
            id(fan_global) = false;
          } else {
            id(fan_global) = true;
          }

  - platform: template
    name: Fan Direction Resync
    id: fan_direction_resync
    entity_category: CONFIG
    icon: "mdi:sync"
    on_press:
      - lambda: |-
          if (id(fan_direction_global) == "forward") {
            id(fan_direction_global) = "reverse";
          } else {
            id(fan_direction_global) = "forward";
          }
              
text_sensor:
  - platform: wifi_info
    mac_address: 
      name: ${name} MAC Address

  - platform: debug
    device:
      name: ${name} Device Info
    reset_reason:
      name: ${name} Reset Reason


binary_sensor:
# binary sensors that can help with states or automations
  - platform: template
    name: Fan Status
    id: fan_status
    lambda: |-
      return id(fan_global);


  - platform: template
    name: Fan Direction Status
    id: fan_direction_forward
    lambda: |-
      return id(fan_direction_global) == "forward";

  - platform: template 
    name: Fan Light Status 
    id: fan_light_toggle 
    lambda: |- 
      return id(fan_light_global);
    
    
### FAN CONTROL
    
fan:
  - platform: template
    name: "Living Room Fan"
    id: living_room_fan
    has_direction: true
    has_oscillating: false
    speed_count: 3
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:ceiling-fan"
    on_turn_on:
      then:
        - fan.turn_on:
            id: living_room_fan
            speed: 1
        - button.press: fan_low
        - globals.set:
            id: fan_global
            value: "true"
    on_turn_off:
      then:
        - fan.turn_off: 
            id: living_room_fan
        - button.press: fan_off
        - globals.set:
            id: fan_global
            value: "false"
    on_speed_set:
      then:
        - lambda: |-
            if (id(living_room_fan).speed == 1) {
              id(fan_low).press();
            } else if (id(living_room_fan).speed == 2) {
              id(fan_medium).press();
            } else if (id(living_room_fan).speed == 3) {
              id(fan_high).press();
            }
    on_direction_set:
# fan needs to be on for the direction to be changed      
      then:
        - button.press: fan_low
        - delay: 10ms
        - button.press: fan_direction


### LIGHT SWITCH
            
light:
  platform: binary
  name: Living Room Fan Light
  id: living_room_fan_light
  output: fan_light_output
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '011110111110'
          protocol:
            pulse_length: 321
            sync: [1, 31]
            zero: [1, 2]
            one: [2, 1]
            inverted: true
          repeat:
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_light_global
          value: "true"
  on_turn_off:
    then:
      - remote_transmitter.transmit_rc_switch_raw:
# code 011110000011 turns both light and fan off, so if statement accounts for this (if fan is on, it is almost always on low)
          code: '011110000011'
          protocol:
            pulse_length: 321
            sync:
              - 1
              - 31
            zero:
              - 1
              - 2
            one:
              - 2
              - 1
            inverted: true
          repeat:
            times: 12
            wait_time: 10ms
      - globals.set:
          id: fan_light_global
          value: 'false'
      - if:
          condition:
            binary_sensor.is_on: fan_status
          then:
            - button.press: fan_low        

output:
  platform: template
  id: fan_light_output
  type: binary
  write_action:
    - if:
        condition:
          lambda: 'return state;'
        then:
          - lambda: |-
              ESP_LOGI("fan.output","write_action: state=ON");
          - globals.set: 
              id: fan_light_global
              value: "false"
        else:
          - lambda: |-
              ESP_LOGI("fan.output","write_action: state=OFF");
          - globals.set: 
              id: fan_light_global
              value: "false"

switch:
  platform: template
  id: fan_light_switch
  internal: true
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  turn_on_action:
    - output.turn_on: fan_light_output
    - globals.set:
        id: fan_light_global
        value: 'true'
    - light.turn_on: living_room_fan_light
  turn_off_action:
    - output.turn_off: fan_light_output
    - globals.set:
        id: fan_light_global
        value: 'false'      
    - light.turn_off: living_room_fan_light

