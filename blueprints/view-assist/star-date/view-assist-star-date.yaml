blueprint:
  name: View Assist - Stardate
  description: Calculates a fictional stardate based on the current date.
  domain: automation
  input:
    trigger_sentences:
      name: Trigger Sentences
      description: A list of voice commands that will trigger this automation.
      default:
        - "What is the stardate"
        - "What's the stardate"
        - "Current stardate"
        - "stardate"
      
trigger:
  - platform: conversation
    command: !input trigger_sentences
    
action:
  - variables:
      stardate: >
        {% set year = now().year %}
        {% set day_of_year = now().strftime('%j') | float %}
        {% set days_in_year = 366 if (year % 4 == 0 and year % 100 != 0) or (year % 400 == 0) else 365 %}
        {{ (((year - 2323) * 1000) + ((day_of_year / days_in_year) * 1000)) | round(1, 'floor') }}
        
  - set_conversation_response: "Captain's log. The current stardate is {{ stardate }}."

mode: single
