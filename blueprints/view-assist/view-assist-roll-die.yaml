blueprint:
  name: View Assist - RPG Dice Roller
  description: Roll a custom combination of dice via voice using PyScript.
  domain: automation
  input:
    command_prompt1:
      name: Command Text 1
      description: Primary phrase to trigger the automation. Must include the {notation} wildcard.
      default: "roll {notation}"
    command_prompt2:
      name: Command Text 2
      description: Alternate phrase to trigger the automation.
      default: "roll a {notation}"
      
alias: View Assist - Dice Roller
description: "Handles voice commands for dice rolling and returns the result"
trigger:
  - platform: conversation
    command:
      - !input command_prompt1
      - !input command_prompt2
condition: []
action:
  # Step 1: Send the spoken wildcard directly to the PyScript
  - service: pyscript.roll_dice
    data:
      notation: "{{ trigger.slots.notation }}"
    response_variable: roll_results
    
  # Step 2: Format the Assist response based on the PyScript output
  - set_conversation_response: >
      {% if roll_results.error is defined %}
        I had trouble with that roll: {{ roll_results.error }}
      {% else %}
        You rolled a total of {{ roll_results.total }}. 
        {% for group in roll_results.breakdown %}
          The {% if group.count > 1 %}{{ group.count }} {% endif %}{{ group.die_type }} resulted in {{ group.individual_rolls | join(' and ') }}. 
        {% endfor %}
      {% endif %}
mode: single
