blueprint:
  name: View Assist - Dice Roller
  description: Roll RPG dice with an optional sound effect. (View Assist - Dice Roller v1.0.0)
  source_url: https://github.com/iamjoshk/home-assistant-collection/blob/main/blueprints/view-assist/view-assist-roll-die.yaml
  domain: automation
  input:
    trigger_sentences_section:
      name: "Trigger Sentence Configuration"
      description: "Modify these sentences to match how you ask to roll dice."
      collapsed: false
      input:
        roll_commands:
          name: Roll Commands
          description: "Sentences to trigger the dice roll. Must include {notation}."
          default:
            - "(roll | throw) {notation}"
            - "(roll | throw) [a | an | the] {notation}"
            - "give me [a] {notation}"
          selector:
            object: {}
    sound_file:
      name: Roll Sound File Path
      description: "Optional path to a sound file (e.g., media-source://media_source/local/dice.wav or /media/dice.wav). Leave empty to disable."
      default: ""
    sound_delay:
      name: Sound Delay (Seconds)
      description: "How long to wait after the sound starts before speaking. Set to 0 if your assistant's natural processing time is long enough."
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: slider

alias: View Assist - Dice Roller
description: "Handles flexible voice commands for dice rolling and plays an optional sound."
trigger:
  - platform: conversation
    command: !input roll_commands
condition: []
action:
  # Step 1: Identify the View Assist media player based on which microphone triggered this
  - variables:
      target_satellite_device: "{{ view_assist_entity(trigger.device_id) if trigger.device_id else none }}"
      target_mediaplayer_device: "{{ state_attr(target_satellite_device, 'mediaplayer_device') if target_satellite_device else none }}"
      sound_path: !input sound_file
      delay_sec: !input sound_delay

  # Step 2: Execute the roll logic
  - service: pyscript.roll_dice
    data:
      notation: "{{ trigger.slots.notation }}"
    response_variable: roll_results

  # Step 3: Play the sound if a path is provided and a media player is found
  - if:
      - condition: template
        value_template: "{{ sound_path != '' and target_mediaplayer_device != none }}"
    then:
      - service: media_player.play_media
        target:
          entity_id: "{{ target_mediaplayer_device }}"
        data:
          media_content_id: "{{ sound_path }}"
          media_content_type: "music"
      - delay: 
          seconds: "{{ delay_sec | float }}"
          
  # Step 4: Read the results aloud via View Assist
  - set_conversation_response: >
      {% if roll_results.error is defined %}
        I had trouble with that roll: {{ roll_results.error }}
      {% else %}
        {% set total_dice = roll_results.breakdown | map(attribute='count') | sum %}
        {% if total_dice == 1 %}
          {% set t_str = roll_results.total | string %}
          {% set article = 'an' if t_str == '11' or t_str == '18' or t_str.startswith('8') else 'a' %}
          You rolled {{ article }} {{ t_str }}.
        {% else %}
          You rolled a total of {{ roll_results.total }}. 
          {% for group in roll_results.breakdown %}
            The {% if group.count > 1 %}{{ group.count }} {% endif %}{{ group.die_type }} resulted in {{ group.individual_rolls | join(' and ') }}. 
          {% endfor %}
        {% endif %}
      {% endif %}
mode: single
