blueprint:
  name: Kiosk Satellite - Dice Roller
  description: Roll RPG dice with an optional sound effect.
  domain: automation
  input:
    trigger_sentences_section:
      name: "Trigger Sentence Configuration"
      description: "Modify these sentences to match how you ask to roll dice."
      collapsed: false
      input:
        roll_commands:
          name: Roll Commands
          description: "Sentences to trigger the dice roll. Must include {notation}."
          default:
            - "(roll | throw) {notation}"
            - "(roll | throw) [a | an | the] {notation}"
            - "give me [a] {notation}"
          selector:
            object: {}
    sound_file:
      name: Roll Sound File Path
      description: "Optional path to a sound file (e.g., media-source://media_source/local/dice.wav). Leave empty to disable."
      default: ""
    sound_delay:
      name: Sound Delay (Seconds)
      description: "How long to wait after the sound starts before speaking."
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: slider

alias: Kiosk Satellite - Dice Roller
description: "Handles flexible voice commands for dice rolling and plays a sound."
mode: single

trigger:
  - trigger: conversation
    command: !input roll_commands

action:
  - variables:
      sound_path: !input sound_file
      delay_sec: !input sound_delay

  # Step 1: Execute the roll logic using your existing PyScript
  - action: pyscript.roll_dice
    data:
      notation: "{{ trigger.slots.notation }}"
    response_variable: roll_results

  # Step 2: Play the sound directly to the triggering Kiosk Satellite
  - if:
      - condition: template
        value_template: "{{ sound_path != '' }}"
    then:
      - action: media_player.play_media
        target:
          # HA automatically routes this to the device's companion media player
          device_id: "{{ trigger.device_id }}"
        data:
          media_content_id: "{{ sound_path }}"
          media_content_type: "music"
      - delay: 
          seconds: "{{ delay_sec | float }}"
          
  # Step 3: Format the spoken response
  - variables:
      spoken_response: >
        {% if roll_results.error is defined %}
          I had trouble with that roll: {{ roll_results.error }}
        {% else %}
          {% set total_dice = roll_results.breakdown | map(attribute='count') | sum %}
          {% if total_dice == 1 %}
            {% set t_str = roll_results.total | string %}
            {% set article = 'an' if t_str == '11' or t_str == '18' or t_str.startswith('8') else 'a' %}
            You rolled {{ article }} {{ t_str }}.
          {% else %}
            You rolled a total of {{ roll_results.total }}. 
            {% for group in roll_results.breakdown %}
              The {% if group.count > 1 %}{{ group.count }} {% endif %}{{ group.die_type }} resulted in {{ group.individual_rolls | join(' and ') }}. 
            {% endfor %}
          {% endif %}
        {% endif %}

  # Step 4: Route the spoken response back to the device
  - set_conversation_response: "{{ spoken_response }}"
