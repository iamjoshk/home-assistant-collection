blueprint:
  name: Voice Assist - Dynamic Length Weather Forecast
  description: Speaks a single-day (Today/Tomorrow), short (Today & Tomorrow), extended (5-day), or detailed (hourly) forecast based on the spoken command.
  domain: automation
  input:
    trigger_sentences_today:
      name: Today Forecast Sentences
      description: "Sentences to trigger just today's forecast."
      default:
        - "(tell|give|what is|what's) [me] the weather today"
        - "(tell|give|what is|what's) today's (forecast|weather)"
      selector:
        object: {}
    trigger_sentences_tomorrow:
      name: Tomorrow Forecast Sentences
      description: "Sentences to trigger just tomorrow's forecast."
      default:
        - "(tell|give|what is|what's) [me] the weather tomorrow"
        - "(tell|give|what is|what's) tomorrow's (forecast|weather)"
      selector:
        object: {}
    trigger_sentences_short:
      name: Short Forecast Sentences
      description: "Sentences to trigger the 2-day forecast (Today and Tomorrow)."
      default:
        - "(tell me|give me|what is|what's) the [weather] forecast"
      selector:
        object: {}
    trigger_sentences_extended:
      name: Extended Forecast Sentences
      description: "Sentences to trigger the full 5-day forecast."
      default:
        - "(tell me|give me|what is|what's) the (five day|extended) [weather] forecast"
      selector:
        object: {}
    trigger_sentences_detailed:
      name: Detailed Forecast Sentences
      description: "Sentences to trigger the hourly forecast for the next 6 hours."
      default:
        - "(tell|give|what is|what's) [me] the (detailed|hourly) [weather] (weather|forecast) [forecast]"
      selector:
        object: {}
    weather_entity:
      name: Weather Entity
      description: "The weather entity to query. Must provide daily, twice-daily, and hourly forecasts."
      selector:
        entity:
          domain: weather

alias: Voice Assist - Dynamic Length Weather Forecast
mode: single

trigger:
  # Trigger 1: Today's Forecast Only
  - trigger: conversation
    command: !input trigger_sentences_today
    id: today

  # Trigger 2: Tomorrow's Forecast Only
  - trigger: conversation
    command: !input trigger_sentences_tomorrow
    id: tomorrow

  # Trigger 3: The Short Forecast
  - trigger: conversation
    command: !input trigger_sentences_short
    id: short

  # Trigger 4: The Extended Forecast
  - trigger: conversation
    command: !input trigger_sentences_extended
    id: extended

  # Trigger 5: The Detailed Forecast
  - trigger: conversation
    command: !input trigger_sentences_detailed
    id: detailed

action:
  - variables:
      weather_entity: !input weather_entity
      # Determine which data structure to request based on the trigger
      forecast_type: >
        {% if trigger.id == 'extended' %}
          daily
        {% elif trigger.id == 'detailed' %}
          hourly
        {% else %}
          twice_daily
        {% endif %}

  # 1. Fetch the forecast from the selected entity dynamically
  - action: weather.get_forecasts
    data:
      type: "{{ forecast_type }}"
    target:
      entity_id: "{{ weather_entity }}"
    response_variable: forecast_response
    continue_on_error: true

  # 2. Parse the response and dynamically build the spoken English text
  - variables:
      forecasts: >
        {% if forecast_response is defined %}
          {{ forecast_response[weather_entity].forecast }}
        {% else %}
          {{ '' }}
        {% endif %}      
      spoken_forecast: >
        {% if forecasts | length > 0 %}
          {% set ns = namespace(sentences=[]) %}
          
          {% if trigger.id == 'extended' %}
            {# --- DAILY PARSING FOR EXTENDED (5 DAYS) --- #}
            {% for f in forecasts[:5] %}
              {% set cond = f.condition | replace('partlycloudy', 'partly cloudy') | replace('clear-night', 'clear') | replace('lightning', 'thunderstorms') | replace('pouring', 'heavy rain') | replace('-', ' ') %}
              {% set high = f.temperature %}
              {% set low = f.templow | default('unknown') %}
              {% set precip_prob = f.precipitation_probability | default(0) | int(0) %}
              
              {% if loop.index0 == 0 %}
                {% set day_name = "Today" %}
              {% elif loop.index0 == 1 %}
                {% set day_name = "Tomorrow" %}
              {% else %}
                {% set day_name = "On " ~ (as_timestamp(f.datetime) | timestamp_custom('%A', true)) %}
              {% endif %}
              
              {% if precip_prob > 0 %}
                {% set phrase = day_name ~ ", expect " ~ cond ~ " with a high of " ~ high ~ ", a low of " ~ low ~ ", and a " ~ precip_prob ~ " percent chance of precipitation." %}
              {% else %}
                {% set phrase = day_name ~ ", expect " ~ cond ~ " with a high of " ~ high ~ " and a low of " ~ low ~ "." %}
              {% endif %}
              
              {% set ns.sentences = ns.sentences + [phrase] %}
            {% endfor %}
            
          {% elif trigger.id == 'detailed' %}
            {# --- HOURLY PARSING FOR DETAILED (UP TO 6 HOURS, CURRENT DAY ONLY, CONSECUTIVE GROUPING) --- #}
            {% set ns_det = namespace(count=0, start_time="", last_time="", cond="", temp="", precip=0, sentences=[]) %}
            
            {% for f in forecasts %}
              {% set f_time = as_local(as_datetime(f.datetime)) %}
              
              {# Only process up to 6 hours, and strictly stop if the day rolls over to tomorrow #}
              {% if f_time.date() == now().date() and ns_det.count < 6 and f_time >= now().replace(minute=0, second=0, microsecond=0) %}
                
                {% set cond = f.condition | replace('partlycloudy', 'partly cloudy') | replace('clear-night', 'clear') | replace('lightning', 'thunderstorms') | replace('pouring', 'heavy rain') | replace('-', ' ') %}
                {% set temp = f.temperature %}
                {% set precip = f.precipitation_probability | default(0) | int(0) %}
                {% set hour_str = f_time.strftime('%-I %p') | lower %}
                
                {% if ns_det.count == 0 %}
                  {# First hour processed: set baseline #}
                  {% set ns_det.start_time = hour_str %}
                  {% set ns_det.last_time = hour_str %}
                  {% set ns_det.cond = cond %}
                  {% set ns_det.temp = temp %}
                  {% set ns_det.precip = precip %}
                {% else %}
                  {# Consecutive hour: check if condition, temp, and precip match the baseline #}
                  {% if cond == ns_det.cond and temp == ns_det.temp and precip == ns_det.precip %}
                    {% set ns_det.last_time = hour_str %}
                  {% else %}
                    {# A change occurred! Format the previous block and push to sentences #}
                    {% if ns_det.start_time == ns_det.last_time %}
                      {% set phrase = "At " ~ ns_det.start_time ~ " it will be " ~ ns_det.temp ~ " degrees and " ~ ns_det.cond %}
                    {% else %}
                      {% set phrase = "From " ~ ns_det.start_time ~ " to " ~ ns_det.last_time ~ " it will be " ~ ns_det.temp ~ " degrees and " ~ ns_det.cond %}
                    {% endif %}
                    
                    {% if ns_det.precip > 0 %}
                      {% set phrase = phrase ~ " with a " ~ ns_det.precip ~ " percent chance of precipitation." %}
                    {% else %}
                      {% set phrase = phrase ~ "." %}
                    {% endif %}
                    
                    {% set ns_det.sentences = ns_det.sentences + [phrase] %}
                    
                    {# Reset baseline to the current hour #}
                    {% set ns_det.start_time = hour_str %}
                    {% set ns_det.last_time = hour_str %}
                    {% set ns_det.cond = cond %}
                    {% set ns_det.temp = temp %}
                    {% set ns_det.precip = precip %}
                  {% endif %}
                {% endif %}
                
                {% set ns_det.count = ns_det.count + 1 %}
              {% endif %}
            {% endfor %}
            
            {# Loop finished: Make sure we push the final group to the sentences list #}
            {% if ns_det.count > 0 %}
              {% if ns_det.start_time == ns_det.last_time %}
                {% set phrase = "At " ~ ns_det.start_time ~ " it will be " ~ ns_det.temp ~ " degrees and " ~ ns_det.cond %}
              {% else %}
                {% set phrase = "From " ~ ns_det.start_time ~ " to " ~ ns_det.last_time ~ " it will be " ~ ns_det.temp ~ " degrees and " ~ ns_det.cond %}
              {% endif %}
              
              {% if ns_det.precip > 0 %}
                {% set phrase = phrase ~ " with a " ~ ns_det.precip ~ " percent chance of precipitation." %}
              {% else %}
                {% set phrase = phrase ~ "." %}
              {% endif %}
              
              {% set ns_det.sentences = ns_det.sentences + [phrase] %}
            {% else %}
              {% set ns_det.sentences = ["There are no more hourly forecasts available for today."] %}
            {% endif %}
            
            {% set ns.sentences = ns.sentences + ns_det.sentences %}
            
          {% else %}
            {# --- TWICE-DAILY PARSING FOR TODAY / TOMORROW / SHORT --- #}
            {% if trigger.id == 'today' %}
              {% set min_diff = 0 %}
              {% set max_diff = 0 %}
            {% elif trigger.id == 'tomorrow' %}
              {% set min_diff = 1 %}
              {% set max_diff = 1 %}
            {% else %}
              {% set min_diff = 0 %}
              {% set max_diff = 1 %}
            {% endif %}
            
            {% for f in forecasts %}
              {% set f_date = as_local(as_datetime(f.datetime)).date() %}
              {% set date_diff = (f_date - now().date()).days %}
              
              {% if min_diff <= date_diff <= max_diff %}
                {% set cond = f.condition | replace('partlycloudy', 'partly cloudy') | replace('clear-night', 'clear') | replace('lightning', 'thunderstorms') | replace('pouring', 'heavy rain') | replace('-', ' ') %}
                {% set temp = f.temperature %}
                {% set precip_prob = f.precipitation_probability | default(0) | int(0) %}
                
                {% if date_diff == 0 %}
                  {% set time_phrase = "Today" if f.is_daytime else "Tonight" %}
                {% elif date_diff == 1 %}
                  {% set time_phrase = "Tomorrow" if f.is_daytime else "Tomorrow night" %}
                {% endif %}
                
                {% if precip_prob > 0 %}
                  {% set phrase = time_phrase ~ ", expect " ~ cond ~ " with a temperature of " ~ temp ~ " degrees and a " ~ precip_prob ~ " percent chance of precipitation." %}
                {% else %}
                  {% set phrase = time_phrase ~ ", expect " ~ cond ~ " with a temperature of " ~ temp ~ " degrees." %}
                {% endif %}
                
                {% set ns.sentences = ns.sentences + [phrase] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          
          {{ ns.sentences | join(' ') }}
        {% else %}
          I'm sorry, I couldn't retrieve the {{forecast_type | replace("_"," ")}} forecast data.
        {% endif %}

  # 3. Route the spoken response back to the device
  - set_conversation_response: "{{ spoken_forecast }}"
