blueprint:
  name: Voice Assist - Dynamic Length Weather Forecast
  description: Speaks a short forecast (Today/Tomorrow) or an extended 5-day forecast based on the spoken command.
  domain: automation
  input:
    trigger_sentences_short:
      name: Short Forecast Sentences
      description: "Sentences to trigger the 2-day forecast (Today and Tomorrow)."
      default:
        - "what is the forecast"
        - "what's the weather forecast"
        - "tell me the [weather] forecast"
      selector:
        object: {}
    trigger_sentences_extended:
      name: Extended Forecast Sentences
      description: "Sentences to trigger the full 5-day forecast."
      default:
        - "what is the extended forecast"
        - "tell me the extended forecast"
        - "give me the five day forecast"
      selector:
        object: {}
    weather_entity:
      name: Weather Entity
      description: "The weather entity to query."
      selector:
        entity:
          domain: weather

alias: Voice Assist - Dynamic Length Weather Forecast
mode: single

trigger:
  # Trigger 1: The Short Forecast
  - trigger: conversation
    command: !input trigger_sentences_short
    id: short

  # Trigger 2: The Extended Forecast
  - trigger: conversation
    command: !input trigger_sentences_extended
    id: extended

action:
  - variables:
      weather_entity: !input weather_entity
      # Check which trigger started the automation
      is_extended: "{{ trigger.id == 'extended' }}"

  # 1. Fetch the daily forecast from the selected entity
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: "{{ weather_entity }}"
    response_variable: forecast_response

  # 2. Parse the response and dynamically build the spoken English text
  - variables:
      forecasts: "{{ forecast_response[weather_entity].forecast }}"
      
      spoken_forecast: >
        {% if forecasts | length > 0 %}
          {% set ns = namespace(sentences=[]) %}
          
          {# Set the loop limit based on the trigger ID #}
          {% set limit = 5 if is_extended else 2 %}
          
          {# The [ : limit ] syntax slices the array so it only loops exactly that many times #}
          {% for f in forecasts[:limit] %}
            
            {# Clean up HA's backend condition strings for natural TTS reading #}
            {% set cond = f.condition | replace('partlycloudy', 'partly cloudy') | replace('lightning', 'thunderstorms') | replace('pouring', 'heavy rain') | replace('-', ' ') %}
            {% set high = f.temperature %}
            {% set low = f.templow | default('unknown') %}
            
            {# Determine how to refer to the day based on the loop index #}
            {% if loop.index0 == 0 %}
              {% set phrase = "Today will be " ~ cond ~ " with a high of " ~ high ~ " and a low of " ~ low ~ "." %}
            {% elif loop.index0 == 1 %}
              {% set phrase = "Tomorrow will be " ~ cond ~ " with a high of " ~ high ~ " and a low of " ~ low ~ "." %}
            {% else %}
              {# Convert the raw datetime string to a full weekday name #}
              {% set day_name = as_timestamp(f.datetime) | timestamp_custom('%A', true) %}
              {% set phrase = "On " ~ day_name ~ ", expect " ~ cond ~ " with a high of " ~ high ~ " and a low of " ~ low ~ "." %}
            {% endif %}
            
            {# Add the generated phrase to our list #}
            {% set ns.sentences = ns.sentences + [phrase] %}
          {% endfor %}
          
          {# Combine all the sentences with a space in between #}
          {{ ns.sentences | join(' ') }}
        {% else %}
          I'm sorry, I couldn't retrieve the forecast data.
        {% endif %}

  # 3. Route the spoken response back to the device
  - set_conversation_response: "{{ spoken_forecast }}"
